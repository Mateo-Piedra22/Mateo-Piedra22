<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      @keyframes gradientShift {
        0% { stop-color: #c7ff69; }
        33% { stop-color: #7a78ff; }
        66% { stop-color: #ff6d38; }
        100% { stop-color: #c7ff69; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.05); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dotPulse {
        0%, 100% { fill-opacity: 1; r: 5; }
        50% { fill-opacity: 0.3; r: 3.5; }
      }
      .anim-grad-1 { animation: gradientShift 8s infinite linear; }
      .anim-pulse { animation: pulseGlow 4s infinite ease-in-out; transform-origin: center; }
      .anim-dot { animation: dotPulse 2s infinite ease-in-out; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .mono-text {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e10" />
      <stop offset="50%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7ff69" class="anim-grad-1" />
      <stop offset="50%" stop-color="#7a78ff" />
      <stop offset="100%" stop-color="#ff6d38" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7a78ff" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#c7ff69" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222228" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#333340" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="24" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="24" fill="url(#circuitGrid)" />
  <rect width="1200" height="320" rx="24" fill="url(#centerGlow)" class="anim-pulse" />

  <!-- Outer Neon Frame -->
  <rect width="1196" height="316" x="2" y="2" rx="22" fill="none" stroke="#26262e" stroke-width="2" />
  <rect width="1150" height="3" x="25" y="2" fill="url(#neonGrad)" />

  <!-- Top System Bar -->
  <g transform="translate(35, 36)">
    <!-- Status Pill -->
    <rect width="155" height="30" rx="15" fill="#18181c" stroke="#2d2d38" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#c7ff69" class="anim-dot" />
    <text x="30" y="20" class="mono-text" font-size="11" font-weight="700" fill="#c7ff69" letter-spacing="1">SYSTEM READY</text>

    <!-- Corner Indicators -->
    <g transform="translate(170, 7)">
      <circle cx="0" cy="8" r="4" fill="#7a78ff" />
      <circle cx="16" cy="8" r="4" fill="#ff6d38" />
      <circle cx="32" cy="8" r="4" fill="#ffc412" />
    </g>

    <!-- Protocol Version Label -->
    <text x="1130" y="20" class="mono-text" font-size="11" font-weight="600" fill="#666675" text-anchor="end" letter-spacing="1.5">
      MATEO.PIEDRA // UNL.CORE.v2026
    </text>
  </g>

  <!-- Central Title Header -->
  <g transform="translate(600, 140)">
    <!-- Sub-heading Tag -->
    <text x="0" y="-15" class="mono-text" font-size="13" font-weight="700" fill="#7a78ff" text-anchor="middle" letter-spacing="3">
      SYSTEMS ARCHITECTURE &amp; FULL-STACK ENGINEERING
    </text>

    <!-- Main Name -->
    <text x="0" y="45" class="title-text" font-size="64" fill="#fdf9f0" text-anchor="middle">
      MATEO PIEDRABUENA
    </text>

    <!-- Dynamic Academic Subtext -->
    <text x="0" y="85" class="mono-text" font-size="16" font-weight="600" fill="#c7ff69" text-anchor="middle" letter-spacing="0.5">
      Computer Engineering Student @ Universidad Nacional del Litoral
    </text>
  </g>

  <!-- Bottom Interactive Anchor Badges -->
  <g transform="translate(600, 275)">
    <!-- Chip 1: ArgenPOS -->
    <g transform="translate(-320, 0)">
      <rect width="200" height="34" x="-100" y="-17" rx="17" fill="#18181e" stroke="#00a652" stroke-width="1.5" />
      <circle cx="-80" cy="0" r="4.5" fill="#00a652" />
      <text x="-65" y="5" class="title-text" font-size="13" font-weight="700" fill="#ffffff">ArgenPOS Platform</text>
    </g>

    <!-- Chip 2: Hardware Bridge -->
    <g transform="translate(-100, 0)">
      <rect width="200" height="34" x="-100" y="-17" rx="17" fill="#18181e" stroke="#7a78ff" stroke-width="1.5" />
      <circle cx="-80" cy="0" r="4.5" fill="#7a78ff" />
      <text x="-65" y="5" class="title-text" font-size="13" font-weight="700" fill="#ffffff">Hardware Bridge</text>
    </g>

    <!-- Chip 3: Cline Marketplace -->
    <g transform="translate(120, 0)">
      <rect width="200" height="34" x="-100" y="-17" rx="17" fill="#18181e" stroke="#ff6d38" stroke-width="1.5" />
      <circle cx="-80" cy="0" r="4.5" fill="#ff6d38" />
      <text x="-65" y="5" class="title-text" font-size="13" font-weight="700" fill="#ffffff">Cline Marketplace</text>
    </g>

    <!-- Chip 4: MotionA Studio -->
    <g transform="translate(340, 0)">
      <rect width="190" height="34" x="-95" y="-17" rx="17" fill="#18181e" stroke="#c7ff69" stroke-width="1.5" />
      <circle cx="-75" cy="0" r="4.5" fill="#c7ff69" />
      <text x="-60" y="5" class="title-text" font-size="13" font-weight="700" fill="#ffffff">MotionA Studio</text>
    </g>
  </g>
</svg>
