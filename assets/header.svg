<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0f0f0f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7ff69" />
      <stop offset="50%" stop-color="#7a78ff" />
      <stop offset="100%" stop-color="#ff6d38" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ff69" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c7ff69" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#262626" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="280" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="280" rx="20" fill="url(#grid)" />
  <rect width="1200" height="140" rx="20" fill="url(#glowGrad)" />

  <!-- Outer Border -->
  <rect width="1196" height="276" x="2" y="2" rx="18" fill="none" stroke="#2d2d2d" stroke-width="2" />

  <!-- Top Ambient Glow Line -->
  <rect width="1160" height="3" x="20" y="2" fill="url(#accentGrad)" />

  <!-- Decorative Corner Accents -->
  <circle cx="28" cy="28" r="4" fill="#c7ff69" />
  <circle cx="44" cy="28" r="4" fill="#7a78ff" />
  <circle cx="60" cy="28" r="4" fill="#ff6d38" />
  <circle cx="76" cy="28" r="4" fill="#ffc412" />
  <circle cx="92" cy="28" r="4" fill="#478bff" />

  <!-- System Monospace Label -->
  <text x="1170" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="12" font-weight="700" fill="#666666" text-anchor="end" letter-spacing="2">SYSTEMS // FULL-STACK ARCHITECT</text>

  <!-- Main Name Title -->
  <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#fdf9f0" text-anchor="middle" letter-spacing="-1">
    MATEO PIEDRABUENA
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="18" font-weight="600" fill="#c7ff69" text-anchor="middle" letter-spacing="1">
    COMPUTER ENGINEERING @ UNL  ·  CREATOR OF ARGENPOS &amp; CLINEMARKET
  </text>

  <!-- Badges Row in Header -->
  <g transform="translate(260, 200)">
    <!-- Badge 1: ArgenPOS -->
    <rect width="180" height="36" rx="18" fill="#1e1e1e" stroke="#00a652" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#00a652" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">ArgenPOS Core</text>

    <!-- Badge 2: Cline Marketplace -->
    <g transform="translate(195, 0)">
      <rect width="210" height="36" rx="18" fill="#1e1e1e" stroke="#7a78ff" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#7a78ff" />
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Cline Marketplace</text>
    </g>

    <!-- Badge 3: MotionA Studio -->
    <g transform="translate(420, 0)">
      <rect width="170" height="36" rx="18" fill="#1e1e1e" stroke="#ff6d38" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#ff6d38" />
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">MotionA Studio</text>
    </g>
  </g>
</svg>
